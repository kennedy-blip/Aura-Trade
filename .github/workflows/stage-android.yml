name: Stage built APK for preview signing
on:
  push:
    paths: ['.github/workflows/stage-android.yml']
permissions:
  actions: read
  contents: write
jobs:
  stage:
    if: github.repository == 'kennedy-blip/Aura-Trade' && github.ref == 'refs/heads/arena/2542c44e-aura-trade'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Stage the exact CI preview as a GitHub blob for local signing
        run: |
          set -euo pipefail
          gh run download 44314428268 --repo "$GITHUB_REPOSITORY" --name auratrade-android-preview --dir "$RUNNER_TEMP/aura"
          apk="$RUNNER_TEMP/aura/artifacts/auratrade-east-africa-preview.apk"
          jq -Rs '{encoding:"base64",content:.}' < <(base64 -w0 "$apk") > "$RUNNER_TEMP/aura-blob.json"
          sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/aura-blob.json" --jq '.sha')
          digest=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "::notice::AuraTrade APK blob $sha SHA-256 $digest"
