name: Stage the account preview APK
on:
  push:
    paths: ['.github/workflows/stage-account-preview.yml']
permissions:
  contents: read
jobs:
  transfer:
    if: github.ref == 'refs/heads/arena/cf1c56fe-aura-trade'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: auratrade-android-preview
          path: package
          run-id: '44326271938'
          github-token: ${{ github.token }}
      - name: Commit the signed package from the verified build job to the release branch
        run: |
          set -euo pipefail
          node scripts/publish-apk.mjs package/artifacts/auratrade-east-africa-preview.apk preview
          cmp public/app/android.json package/public/app/android.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app/android.json public/app/auratrade-east-africa-preview.apk
          git commit -m 'Publish signed AuraTrade 1.2 account preview'
          git push origin "HEAD:$GITHUB_REF_NAME"
